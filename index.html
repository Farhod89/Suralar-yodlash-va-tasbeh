<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Қисқа суралар — ёдлаш дастури</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#123028">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Суралар">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg-deep:#0e1f1c;
    --bg-panel:#123028;
    --bg-panel-2:#16392f;
    --gold:#c9a24b;
    --gold-soft:#e2c17c;
    --ink:#eef3ee;
    --ink-dim:#a9c2b6;
    --green-read:#4caf6a;
    --green-glow:rgba(76,175,106,.35);
    --line:#254a3e;
    --danger:#c96b4b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1a4638 0%, transparent 60%),
      var(--bg-deep);
    color:var(--ink);
    font-family:"Segoe UI","Noto Sans",system-ui,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px 12px 100px;
  }
  .app{width:100%;max-width:760px;}

  /* ---------- Home: surah picker ---------- */
  .home-title{
    text-align:center;
    color:var(--gold-soft);
    font-size:1.3rem;
    margin:10px 0 4px;
  }
  .home-sub{
    text-align:center;
    color:var(--ink-dim);
    font-size:.85rem;
    margin-bottom:20px;
  }
  .sura-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }
  .sura-card{
    background:linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 14px;
    cursor:pointer;
    text-align:center;
    transition:transform .12s ease, border-color .12s ease;
  }
  .sura-card:hover{border-color:var(--gold);transform:translateY(-2px);}
  .sura-card .sname{font-size:1.05rem;font-weight:700;color:var(--ink);}
  .sura-card .sinfo{font-size:.75rem;color:var(--ink-dim);margin-top:4px;}
  .sura-card .sdone{font-size:.72rem;color:var(--gold-soft);margin-top:6px;}

  .menu-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px;
  }
  .menu-card{
    background:linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border:1px solid var(--line);border-radius:18px;
    padding:26px 14px;text-align:center;cursor:pointer;
    transition:transform .12s ease, border-color .12s ease;
  }
  .menu-card:hover{border-color:var(--gold);transform:translateY(-2px);}
  .menu-icon{font-size:2.2rem;margin-bottom:8px;}
  .menu-card .sname{font-size:1.1rem;font-weight:700;}
  .menu-card .sinfo{font-size:.78rem;color:var(--ink-dim);margin-top:4px;}

  /* ---------- Tasbih (salovot) ---------- */
  .tasbih-wrap{
    background:linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border:1px solid var(--line);border-radius:22px;
    padding:26px 18px 30px;text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
    user-select:none;
  }
  .tasbih-arabic{font-size:1.6rem;color:var(--gold-soft);margin-bottom:8px;line-height:1.6;}
  .tasbih-cyr{font-size:1.15rem;color:var(--ink-dim);margin-bottom:22px;}
  .tasbih-btn{
    width:100%;
    background:radial-gradient(circle at 50% 30%, #2f7a52, #17402a);
    color:#eafff0;
    border:2px solid var(--gold);
    border-radius:50%;
    aspect-ratio:1/1;
    max-width:230px;
    margin:0 auto 20px;
    font-size:1.05rem;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;
    box-shadow:0 10px 26px rgba(47,122,82,.4);
    cursor:pointer;
  }
  .tasbih-btn:active{transform:scale(.96);}
  .tasbih-count-big{font-size:2.4rem;font-variant-numeric:tabular-nums;}
  .tasbih-stats{
    display:flex;justify-content:center;gap:22px;margin-bottom:16px;font-size:.92rem;color:var(--ink-dim);
  }
  .tasbih-stats b{color:var(--ink);font-size:1.05rem;}
  .tasbih-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .tasbih-actions button{font-size:.82rem;padding:9px 14px;}
  .btn-minus{background:var(--bg-panel-2);color:var(--ink-dim);border:1px solid var(--line);}
  .btn-target{background:transparent;color:var(--gold-soft);border:1px solid var(--gold);}
  .btn-reset-tasbih{background:transparent;color:var(--danger);border:1px solid var(--danger);}

  .target-modal .presets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0;}
  .target-modal .presets button{
    background:var(--bg-panel);color:var(--ink);border:1px solid var(--line);
    padding:8px 14px;font-size:.85rem;
  }
  .target-modal .presets button.sel{border-color:var(--gold);color:var(--gold-soft);}
  .target-modal input[type=number]{
    width:140px;background:#0b2119;border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:10px 12px;font-size:1.1rem;text-align:center;margin-bottom:14px;
  }

  /* ---------- Top status ---------- */
  .backbar{
    display:flex;align-items:center;gap:10px;
    margin-bottom:14px;
  }
  .btn-back{
    background:var(--bg-panel-2);
    color:var(--gold-soft);
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 12px;
    font-size:.85rem;
    cursor:pointer;
  }
  .active-sname{font-size:1.15rem;font-weight:700;color:var(--gold-soft);}

  .topbar{
    background:linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border:1px solid var(--line);
    border-radius:18px;
    padding:16px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
    position:sticky;
    top:10px;
    z-index:20;
  }
  .count-block{display:flex;align-items:baseline;gap:10px;}
  .count-num{
    font-size:2.1rem;font-weight:700;color:var(--gold-soft);
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 18px rgba(226,193,124,.35);
    transition:transform .25s ease;
  }
  .count-num.bump{transform:scale(1.25);}
  .count-label{font-size:.8rem;color:var(--ink-dim);line-height:1.25;max-width:130px;}
  .percent-block{text-align:right;}
  .percent-num{font-size:1.3rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
  .percent-label{font-size:.7rem;color:var(--ink-dim);}

  .progress-track{
    height:8px;border-radius:6px;background:#0b2119;overflow:hidden;
    margin-top:12px;border:1px solid var(--line);
  }
  .progress-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,#2f7a52,var(--green-read));
    transition:width .35s ease;
  }

  /* ---------- Mode tabs ---------- */
  .mode-tabs{
    display:flex;gap:8px;margin:16px 0 6px;
  }
  .mode-tab{
    flex:1;text-align:center;
    padding:9px 6px;
    border-radius:10px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    color:var(--ink-dim);
    font-size:.78rem;
    cursor:pointer;
    font-weight:600;
  }
  .mode-tab.active{
    background:linear-gradient(180deg,#2f7a52,#1f5b3c);
    color:#eafff0;
    border-color:transparent;
  }
  .mode-panel{
    background:var(--bg-panel);
    border:1px dashed var(--line);
    border-radius:12px;
    padding:10px 14px;
    margin-bottom:14px;
    font-size:.82rem;
    color:var(--ink-dim);
    display:none;
  }
  .mode-panel.show{display:block;}
  .mode-panel input[type=number]{
    width:64px;background:#0b2119;border:1px solid var(--line);
    color:var(--ink);border-radius:8px;padding:6px 8px;font-size:.9rem;
    margin:0 6px;
  }
  .mode-panel button{
    background:var(--gold);color:#1a2e22;border:none;border-radius:8px;
    padding:7px 12px;font-size:.78rem;font-weight:700;cursor:pointer;margin-top:8px;
  }

  /* ---------- Controls ---------- */
  .controls{display:flex;gap:10px;margin:10px 0 14px;flex-wrap:wrap;}
  button{
    font-family:inherit;font-size:.95rem;border:none;border-radius:12px;
    padding:12px 16px;cursor:pointer;font-weight:600;
    display:flex;align-items:center;gap:8px;
    transition:transform .12s ease, filter .12s ease;
  }
  button:active{transform:scale(.96);}
  .btn-mic{
    background:linear-gradient(180deg,#2f7a52,#1f5b3c);
    color:#eafff0;flex:1;justify-content:center;
    box-shadow:0 6px 16px rgba(47,122,82,.35);
  }
  .btn-mic.listening{
    background:linear-gradient(180deg,#c96b4b,#a3492c);
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(201,107,75,.5);}
    70%{box-shadow:0 0 0 14px rgba(201,107,75,0);}
    100%{box-shadow:0 0 0 0 rgba(201,107,75,0);}
  }
  .btn-restart{background:var(--bg-panel-2);color:var(--gold-soft);border:1px solid var(--gold);}
  .dot{width:9px;height:9px;border-radius:50%;background:#eafff0;display:inline-block;}
  .btn-mic.listening .dot{animation:blink 1s infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}

  .status-line{font-size:.82rem;color:var(--ink-dim);text-align:center;margin-bottom:10px;min-height:18px;}

  .manual-box{
    background:var(--bg-panel);border:1px dashed var(--line);border-radius:14px;
    padding:12px 14px;margin-bottom:18px;
  }
  .manual-label{font-size:.78rem;color:var(--ink-dim);margin-bottom:8px;line-height:1.4;}
  #manualInput{
    width:100%;resize:vertical;background:#0b2119;border:1px solid var(--line);
    border-radius:10px;color:var(--ink);font-family:inherit;font-size:1rem;
    padding:10px 12px;margin-bottom:8px;
  }
  #manualInput:focus{outline:1px solid var(--gold);}
  .btn-clear{background:transparent;border:1px solid var(--line);color:var(--ink-dim);font-size:.82rem;padding:8px 12px;}

  /* ---------- Sura text ---------- */
  .basmala{text-align:center;color:var(--gold-soft);font-size:1.1rem;margin:6px 0 4px;}
  .basmala-cyr{text-align:center;color:var(--ink-dim);font-size:.95rem;margin-bottom:16px;}
  .sura-card-text{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:20px;
    padding:22px 20px 30px;box-shadow:0 10px 30px rgba(0,0,0,.3);
  }
  .ayah{display:inline;line-height:2.5;font-size:1.18rem;}
  .ayah-num{
    display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:50%;background:var(--bg-panel-2);
    border:1px solid var(--gold);color:var(--gold-soft);font-size:.68rem;font-weight:700;
    margin:0 8px;vertical-align:middle;
  }
  .word{
    color:var(--ink);padding:2px 3px;border-radius:6px;
    transition:color .25s ease, background .25s ease, text-shadow .25s ease;
    cursor:pointer;
  }
  .word.read{color:#c8f5d6;background:rgba(76,175,106,.16);text-shadow:0 0 10px var(--green-glow);}
  .word.current{outline:2px solid var(--gold);outline-offset:1px;}
  .word.locked{opacity:.28;}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;
    align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal-backdrop.show{display:flex;}
  .modal{
    background:var(--bg-panel-2);border:1px solid var(--gold);border-radius:16px;
    padding:22px;max-width:340px;width:100%;text-align:center;
  }
  .modal p{color:var(--ink);font-size:1rem;margin:0 0 18px;}
  .modal-btns{display:flex;gap:10px;}
  .modal-btns button{flex:1;justify-content:center;}
  .btn-yes{background:var(--green-read);color:#06210f;}
  .btn-no{background:transparent;border:1px solid var(--ink-dim);color:var(--ink);}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--gold-soft);color:#1a2e22;padding:10px 18px;border-radius:10px;
    font-weight:700;font-size:.95rem;opacity:0;transition:all .35s ease;
    pointer-events:none;z-index:60;box-shadow:0 8px 20px rgba(0,0,0,.3);
    text-align:center;max-width:90vw;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .footnote{text-align:center;color:var(--ink-dim);font-size:.75rem;margin-top:16px;line-height:1.5;padding:0 10px;}
</style>
</head>
<body>

<div class="app" id="app"></div>

<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal">
    <p id="modalText">Ҳисобни ҳам бошидан бошлайми?</p>
    <div class="modal-btns">
      <button class="btn-yes" id="modalYes">Ҳа</button>
      <button class="btn-no" id="modalNo">Йўқ</button>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>

<div id="targetModalBackdrop" class="modal-backdrop">
  <div class="modal target-modal">
    <p id="targetModalTitle">Нечта айтмоқчисиз?</p>
    <div class="presets" id="targetPresets">
      <button data-v="33">33</button>
      <button data-v="100">100</button>
      <button data-v="1000">1000</button>
      <button data-v="40000">40000</button>
    </div>
    <input type="number" id="targetInput" min="1" placeholder="Ёки ўзингиз киритинг">
    <div class="modal-btns">
      <button class="btn-yes" id="targetStartBtn">Бошлаш</button>
      <button class="btn-no" id="targetCancelBtn">Бекор қилиш</button>
    </div>
  </div>
</div>

/* ---------------- localStorage yordamchilari (har bir sura uchun alohida kalitlar) ---------------- */
function lsGet(key, def){
  try{ const v = localStorage.getItem(key); return v===null? def : v; }catch(e){ return def; }
}
function lsSet(key, val){
  try{ localStorage.setItem(key, val); }catch(e){}
}
function countKey(id){ return 'voqea10_count_'+id; }
function dailyQuotaKey(id){ return 'voqea10_dailyquota_'+id; }
function dailyDayKey(id){ return 'voqea10_dailyday_'+id; }
function incrKey(id){ return 'voqea10_incr_'+id; }
function salovotTargetKey(id){ return 'voqea10_sal_target_'+id; }
function salovotCountKey(id){ return 'voqea10_sal_count_'+id; }
function salovotCyclesKey(id){ return 'voqea10_sal_cycles_'+id; }

function renderSalovotMenu(){
  activeSalovotId = null;

    <div class="backbar">
      <button class="btn-back" id="btnMainMenu2">← Бош меню</button>

    <div class="sura-grid">`;
  SALOVOT_ORDER.forEach(id=>{
    const s = SALOVOTLAR[id];
    const cycles = lsGet(salovotCyclesKey(id), '0');
    const target = lsGet(salovotTargetKey(id), '');
    const count = parseInt(lsGet(salovotCountKey(id), '0'), 10);
    const inProgress = target && count>0 && count < parseInt(target,10);
    html += `<div class="sura-card" data-id="${id}">
      <div class="sname">${s.name}</div>
      <div class="sinfo">${inProgress ? ('Давом этмоқда: '+count+'/'+target) : 'Босиб бошланг'}</div>
      <div class="sdone">${cycles} марта тўлиқ якунланган</div>
    </div>`;
  });
  html += `</div>`;
  appEl.innerHTML = html;
  document.getElementById('btnMainMenu2').addEventListener('click', renderMainMenu);
  appEl.querySelectorAll('.sura-card').forEach(card=>{
    card.addEventListener('click', ()=> openSalovot(card.dataset.id));
  });
}

function openSalovot(id){
  const target = parseInt(lsGet(salovotTargetKey(id), '0'), 10);
  const count = parseInt(lsGet(salovotCountKey(id), '0'), 10);
  if(target > 0 && count < target){
    activeSalovotId = id;
    renderSalovotCounter();
  } else {
    showTargetModal(id);
  }
}

function showTargetModal(id){
  activeSalovotId = id;
  const s = SALOVOTLAR[id];
  document.getElementById('targetModalTitle').textContent = '«'+s.name+'» — нечта айтмоқчисиз?';
  const lastTarget = lsGet(salovotTargetKey(id), '');
  const input = document.getElementById('targetInput');
  input.value = lastTarget || '';
  document.querySelectorAll('#targetPresets button').forEach(b=>{
    b.classList.toggle('sel', lastTarget && b.dataset.v === lastTarget);
  });
  document.getElementById('targetModalBackdrop').classList.add('show');
  input.focus();
}
function hideTargetModal(){
  document.getElementById('targetModalBackdrop').classList.remove('show');
}

document.getElementById('targetPresets').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  document.getElementById('targetInput').value = btn.dataset.v;
  document.querySelectorAll('#targetPresets button').forEach(b=> b.classList.toggle('sel', b===btn));
});
document.getElementById('targetCancelBtn').addEventListener('click', hideTargetModal);
document.getElementById('targetStartBtn').addEventListener('click', ()=>{
  const v = parseInt(document.getElementById('targetInput').value, 10);
  if(!v || v <= 0){ showToast('Илтимос, тўғри сон киритинг.'); return; }
  lsSet(salovotTargetKey(activeSalovotId), String(v));
  lsSet(salovotCountKey(activeSalovotId), '0');
  hideTargetModal();
  renderSalovotCounter();
});

function renderSalovotCounter(){
  const id = activeSalovotId;
  const s = SALOVOTLAR[id];
  const target = parseInt(lsGet(salovotTargetKey(id), '0'), 10);
  const count = parseInt(lsGet(salovotCountKey(id), '0'), 10);
  const cycles = lsGet(salovotCyclesKey(id), '0');

  appEl.innerHTML = `
    <div class="backbar">
      <button class="btn-back" id="btnSalovotBack">← Саловотлар</button>
      <div class="active-sname">${s.name}</div>
    </div>
    <div class="tasbih-wrap">
      <div class="tasbih-arabic">${s.arabic}</div>
      <div class="tasbih-cyr">${s.name}</div>

      <div class="tasbih-btn" id="tasbihBtn">
        <div class="tasbih-count-big" id="tasbihCount">${count}</div>
        <div style="font-size:.75rem;opacity:.85;">босинг</div>
      </div>

      <div class="tasbih-stats">
        <div>Айтилди: <b id="statSaid">${count}</b></div>
        <div>Қолди: <b id="statLeft">${Math.max(target-count,0)}</b></div>
      </div>

      <div class="tasbih-actions">
        <button class="btn-minus" id="tasbihMinus">−1</button>
        <button class="btn-target" id="tasbihTarget">🎯 Мақсадни ўзгартириш</button>
        <button class="btn-reset-tasbih" id="tasbihReset">↺ Ҳисобни бошидан бошлаш</button>
      </div>
      <div class="footnote" style="margin-top:16px;">Жами тўлиқ якунлангани: <b>${cycles}</b> марта</div>
    </div>
  `;

  document.getElementById('btnSalovotBack').addEventListener('click', renderSalovotMenu);
  document.getElementById('tasbihTarget').addEventListener('click', ()=> showTargetModal(id));
  document.getElementById('tasbihReset').addEventListener('click', ()=>{
    lsSet(salovotCountKey(id), '0');
    renderSalovotCounter();
  });
  document.getElementById('tasbihMinus').addEventListener('click', ()=> tasbihChange(-1));
  document.getElementById('tasbihBtn').addEventListener('click', ()=> tasbihChange(1));
}

function tasbihChange(delta){
  const id = activeSalovotId;
  const target = parseInt(lsGet(salovotTargetKey(id), '0'), 10);
  let count = parseInt(lsGet(salovotCountKey(id), '0'), 10) + delta;
  if(count < 0) count = 0;

  if(navigator.vibrate && delta>0){ try{ navigator.vibrate(12); }catch(e){} }

  if(target>0 && count >= target){
    lsSet(salovotCountKey(id), '0');
    let cycles = parseInt(lsGet(salovotCyclesKey(id), '0'), 10) + 1;
    lsSet(salovotCyclesKey(id), String(cycles));
    showToast('Муборак бўлсин! '+target+' марта тўлиқ якунландингиз ✅');
    renderSalovotCounter();
    return;
  }
  lsSet(salovotCountKey(id), String(count));
  document.getElementById('tasbihCount').textContent = count;
  document.getElementById('statSaid').textContent = count;
  document.getElementById('statLeft').textContent = Math.max(target-count, 0);
}

function openSura(id){
  activeSuraId = id;
  activeMode = 'free';
  renderReadingScreen();
}

function renderReadingScreen(){

  const savedCount = lsGet(countKey(activeSuraId), '0');

    <div class="backbar">

      <div class="active-sname">${s.name} сураси</div>
    </div>

    <div class="topbar">
      <div class="count-block">
        <div id="countNum" class="count-num">${savedCount}</div>
        <div class="count-label">марта ўқидингиз</div>
      </div>
      <div class="percent-block">
        <div id="percentNum" class="percent-num">0%</div>
        <div class="percent-label">ушбу ўқишда</div>
      </div>
    </div>
    <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>

    <div class="mode-tabs">
      <div class="mode-tab active" data-mode="free">Эркин ўқиш</div>
      <div class="mode-tab" data-mode="daily">Кунлик режа</div>
      <div class="mode-tab" data-mode="incr">Оятма-оят</div>
    </div>

    <div class="mode-panel" id="panelDaily">
      Кунига неча оят: <input type="number" id="dailyQuotaInput" min="1" max="${s.ayahs.length}" value="${lsGet(dailyQuotaKey(activeSuraId), Math.min(3, s.ayahs.length))}">
      <div id="dailyInfo" style="margin-top:6px;"></div>
      <button id="dailyNextBtn">Бугунги қисмни тугатдим → эртангисига ўтиш</button>
      <button id="dailyResetBtn" style="background:transparent;border:1px solid var(--line);color:var(--ink-dim);">Кундан бошлашни қайта бошлаш</button>
    </div>

    <div class="mode-panel" id="panelIncr">
      Ҳозирча ёдланган: <b id="incrLabel">1</b>-оятгача.
      <div>
        <button id="incrNextBtn">Кейинги оятни қўшиш</button>
        <button id="incrResetBtn" style="background:transparent;border:1px solid var(--line);color:var(--ink-dim);">1-оятдан қайта бошлаш</button>

      <div class="manual-label">Ўқиганингизни шу ерга ёзинг ёки телефон клавиатурасидаги 🎤 диктант тугмасидан фойдаланинг:</div>
      <textarea id="manualInput" rows="2" placeholder="Бу ерга гапиринг ёки ёзинг..."></textarea>
      <button id="manualClear" class="btn-clear">Майдонни тозалаш</button>
    </div>

    <div class="basmala">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيمِ</div>
    <div class="basmala-cyr">Бисмиллаҳир Роҳманир Роҳийм</div>

    <div class="sura-card-text">
      <div id="suraText" class="ayah"></div>
    </div>

    <div class="footnote">
      Матн — оммабоп ўзбекча кирилл транслитерацияси. Сичқонча/бармоқ сўзлар устидан юрса ёки микрофон/қутичага гапирсангиз, шу сўзгача бўлган қисм яшилга ўтади. Сўзни тузатиш учун устига икки марта босинг. Талаффузни албатта ўз устозингиздан тасдиқлаб олинг.

  document.getElementById('btnHome').addEventListener('click', renderSuraHome);

    tab.addEventListener('click', ()=> switchMode(tab.dataset.mode));
  });
  document.getElementById('dailyQuotaInput').addEventListener('change', onDailyQuotaChange);
  document.getElementById('dailyNextBtn').addEventListener('click', onDailyNext);
  document.getElementById('dailyResetBtn').addEventListener('click', onDailyReset);

  document.getElementById('incrResetBtn').addEventListener('click', onIncrReset);

/* ---------------- Rejim almashtirish ---------------- */
function switchMode(mode){
  activeMode = mode;
  document.querySelectorAll('.mode-tab').forEach(t=> t.classList.toggle('active', t.dataset.mode===mode));
  document.getElementById('panelDaily').classList.toggle('show', mode==='daily');
  document.getElementById('panelIncr').classList.toggle('show', mode==='incr');
  if(mode==='daily') updateDailyInfo();
  if(mode==='incr') updateIncrLabel();
  buildSuraDom();
}

/* ---------------- Kunlik reja mantig'i ---------------- */
function getDailyQuota(){
  return parseInt(lsGet(dailyQuotaKey(activeSuraId), '3'), 10) || 1;
}
function getDailyDay(){
  return parseInt(lsGet(dailyDayKey(activeSuraId), '0'), 10) || 0;
}
function onDailyQuotaChange(e){
  const v = Math.max(1, parseInt(e.target.value,10) || 1);
  lsSet(dailyQuotaKey(activeSuraId), String(v));
  updateDailyInfo();
  buildSuraDom();
}
function onDailyNext(){
  const s = SURAS[activeSuraId];
  const quota = getDailyQuota();
  const totalDays = Math.ceil(s.ayahs.length/quota);
  let day = getDailyDay() + 1;
  if(day >= totalDays) day = 0;
  lsSet(dailyDayKey(activeSuraId), String(day));
  updateDailyInfo();
  buildSuraDom();
  showToast(day===0 ? 'Барча кунлик қисмлар тугади — қайтадан 1-кундан бошланди.' : (day+1)+'-кунга ўтдингиз.');
}
function onDailyReset(){
  lsSet(dailyDayKey(activeSuraId), '0');
  updateDailyInfo();
  buildSuraDom();
}
function updateDailyInfo(){
  const s = SURAS[activeSuraId];
  const quota = getDailyQuota();
  const day = getDailyDay();
  const totalDays = Math.ceil(s.ayahs.length/quota);
  const from = day*quota+1;
  const to = Math.min((day+1)*quota, s.ayahs.length);
  document.getElementById('dailyInfo').textContent =
    (day+1)+'-кун / '+totalDays+' кун — бугун '+from+'-'+to+'-оятлар устида ишланг.';
}

/* ---------------- Oyatma-oyat (incremental) mantig'i ---------------- */
function getIncrUpTo(){
  return parseInt(lsGet(incrKey(activeSuraId), '1'), 10) || 1;
}
function onIncrNext(){
  const s = SURAS[activeSuraId];
  let upTo = getIncrUpTo();
  if(upTo < s.ayahs.length){
    upTo += 1;
    lsSet(incrKey(activeSuraId), String(upTo));
    updateIncrLabel();
    buildSuraDom();
    showToast(upTo+'-оят қўшилди.');
  } else {
    showToast('Сиз аллақачон барча оятларни қўшгансиз!');
  }
}
function onIncrReset(){
  lsSet(incrKey(activeSuraId), '1');
  updateIncrLabel();
  buildSuraDom();
}
function updateIncrLabel(){
  document.getElementById('incrLabel').textContent = getIncrUpTo();
}

/* ---------------- Faol rejimga qarab ko'rsatiladigan oyatlar oralig'i ---------------- */
function getVisibleAyahRange(){
  const s = SURAS[activeSuraId];
  if(activeMode === 'daily'){
    const quota = getDailyQuota();
    const day = getDailyDay();
    return [day*quota, Math.min((day+1)*quota, s.ayahs.length)]; // [start, end) index
  }
  if(activeMode === 'incr'){
    return [0, getIncrUpTo()];
  }
  return [0, s.ayahs.length];
}

/* ---------------- Matnni chizish ---------------- */
function buildSuraDom(){
  const suraTextEl = document.getElementById('suraText');
  suraTextEl.innerHTML = '';
  flatWords = [];
  currentIndex = 0;
  const s = SURAS[activeSuraId];
  const [start, end] = getVisibleAyahRange();
  totalWords = 0;
  const frag = document.createDocumentFragment();
  s.ayahs.forEach((words, ayahIdx)=>{
    const visible = ayahIdx >= start && ayahIdx < end;
    words.forEach((w)=>{
      const span = document.createElement('span');
      span.className = 'word' + (visible ? '' : ' locked');
      span.textContent = w;
      if(visible){
        span.addEventListener('mouseenter', ()=>{
          if(hoverTrackingEnabled){
            const idx = flatWords.indexOf(span);
            if(idx>=0) setCurrentIndex(idx+1);
          }
        });
        span.addEventListener('dblclick', (e)=>{
          e.stopPropagation();
          const val = prompt('Сўзни таҳрирлаш:', span.textContent);
          if(val !== null && val.trim() !== ''){ span.textContent = val.trim(); }
        });
        flatWords.push(span);
        totalWords++;
      }
      frag.appendChild(span);
      frag.appendChild(document.createTextNode(' '));
    });
    const num = document.createElement('span');
    num.className = 'ayah-num';
    num.textContent = (ayahIdx+1);
    frag.appendChild(num);
  });
  suraTextEl.appendChild(frag);
  updateHighlight();
}

function updateHighlight(){
  for(let i=0;i<flatWords.length;i++){
    flatWords[i].classList.toggle('read', i < currentIndex);
    flatWords[i].classList.toggle('current', i === currentIndex);
  }
  const pct = totalWords>0 ? Math.round((currentIndex/totalWords)*100) : 0;
  document.getElementById('percentNum').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
  const cur = flatWords[Math.min(currentIndex, flatWords.length-1)];
  if(cur){
    const rect = cur.getBoundingClientRect();
    if(rect.top < 90 || rect.bottom > window.innerHeight - 40){
      cur.scrollIntoView({block:'center', behavior:'smooth'});
    }
  }
}

function bumpCount(){
  const el = document.getElementById('countNum');
  el.classList.add('bump');
  setTimeout(()=>el.classList.remove('bump'), 260);
}

function advance(byWords){
  if(byWords <= 0) return;
  setCurrentIndex(currentIndex + byWords);
}
function setCurrentIndex(newIndex){
  if(newIndex <= currentIndex) return; // faqat oldinga
  currentIndex = newIndex;
  if(currentIndex >= totalWords && totalWords>0){
    currentIndex = totalWords;
    updateHighlight();
    let cnt = parseInt(lsGet(countKey(activeSuraId),'0'),10) || 0;
    cnt += 1;
    lsSet(countKey(activeSuraId), String(cnt));
    document.getElementById('countNum').textContent = cnt;
    bumpCount();
    showToast('Хатм муборак бўлсин! Сиз ' + cnt + '-марта ўқидингиз ✅');
    setTimeout(()=>{
      currentIndex = 0;
      updateHighlight();
      const mi = document.getElementById('manualInput');
      if(mi){ mi.value=''; lastManualWordCount=0; }
    }, 900);
  } else {
    updateHighlight();
  }
}

/* ---------------- Mikrofon / qo'lda kiritish ---------------- */
function countArabicWords(text){
  return text.trim().split(/\s+/).filter(Boolean).length;
}
function buildTrackingControls(){
  const statusLine = document.getElementById('statusLine');
  const restartBtn = document.getElementById('restartBtn');
  const manualInput = document.getElementById('manualInput');
  const manualClear = document.getElementById('manualClear');
  const suraTextEl = document.getElementById('suraText');

  manualInput.addEventListener('input', ()=>{
    const wc = countArabicWords(manualInput.value);
    const delta = wc - lastManualWordCount;
    if(delta > 0){ advance(delta); lastManualWordCount = wc; }
    else if(delta < 0){ lastManualWordCount = wc; }
  });
  manualClear.addEventListener('click', ()=>{
    manualInput.value=''; lastManualWordCount=0; manualInput.focus();
  });

  suraTextEl.addEventListener('touchmove', (e)=>{
    if(!hoverTrackingEnabled) return;
    const touch = e.touches[0];
    if(!touch) return;
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    if(el && el.classList && el.classList.contains('word') && !el.classList.contains('locked')){
      const idx = flatWords.indexOf(el);
      if(idx >= 0) setCurrentIndex(idx+1);
    }
  }, {passive:true});

  restartBtn.addEventListener('click', ()=>{
    currentIndex = 0;
    updateHighlight();
    modalText.textContent = 'Ҳисобни (марта сонини) ҳам бошидан бошлайми?';
    modalBackdrop.dataset.action = 'restart';
    modalBackdrop.classList.add('show');
  });
}

function stopRecognitionIfAny(){}

modalYes.addEventListener('click', ()=>{
  if(modalBackdrop.dataset.action === 'restart'){
    lsSet(countKey(activeSuraId), '0');
    document.getElementById('countNum').textContent = '0';
    showToast('Ҳисоб ҳам бошидан бошланди.');
  }
  modalBackdrop.classList.remove('show');
});
modalNo.addEventListener('click', ()=>{
  showToast('Сура бошидан, ҳисоб эса давом этади.');
  modalBackdrop.classList.remove('show');
});

/* ================= ISHGA TUSHIRISH ================= */
renderMainMenu();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
